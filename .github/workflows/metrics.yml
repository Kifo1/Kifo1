name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]  # Dayly
  workflow_dispatch:
  push: {branches: ["master", "main", "develop"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          user: kifo1
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: no  # WICHTIG: Reduziert API Calls drastisch
          
          # Repository-Einstellungen für ALLE Repos
          repositories_batch: 100  # Größere Batches
          repositories_affiliations: owner, collaborator, organization_member
          
          # Timeout-Einstellungen (KRITISCH!)
          plugin_languages_analysis_timeout: 45  # 45 Minuten
          plugin_languages_analysis_timeout_repositories: 15  # 15 Min pro Repo
          
          # Sprachen-Plugin optimiert
          plugin_languages: yes
          plugin_languages_limit: 12
          plugin_languages_threshold: 0%
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 1000
          
          # Weitere Plugins
          plugin_lines: yes
          
          # Timezone
          config_timezone: Europe/Berlin
          config_display: large
          
          # Debug (später ausschalten)
          debug: yes
          output_action: commit
